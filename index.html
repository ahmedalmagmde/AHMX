<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmx</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--pan:#f3f4f6;--ink:#000;--mut:#555;--line:#dcdfe5;--navy:#0f2f73;--gold:#ffb81c;--ok:#16a34a;--ts:85%;--tl:91%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 'IBM Plex Sans Arabic',Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px}
.logo{background:transparent;border-radius:12px;padding:2px 10px;display:flex}.logo img{height:60px;mix-blend-mode:multiply}
select{font:inherit;border-radius:12px;border:1px solid var(--line);padding:6px 10px;background:var(--bg);color:var(--ink)}
.seg{display:flex;background:var(--pan);border-radius:999px;padding:4px;margin-inline-start:auto}
.tab{background:transparent;color:var(--ink);border:0;padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer;transition:background .25s,color .25s}
.tab[aria-pressed=true]{background:var(--navy);color:#fff;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px 16px 120px}
button{font:inherit}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shell{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start}
.rail{display:flex;flex-direction:column;gap:8px;position:sticky;top:76px}
.cat{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:var(--pan);color:var(--ink);border-radius:20px;padding:10px 4px;cursor:pointer;transition:transform .2s,border-color .2s}
.cat span{font-size:28px}.cat[aria-pressed=true]{border-color:var(--navy);transform:scale(1.05);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.tile{background:#e3e5e8;border:0;border-radius:28px;padding:18px 10px 14px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s}
.tile .em{font-size:56px;line-height:1;transition:transform .25s}.tile:hover .em{transform:rotate(-10deg) scale(1.15)}.tile:active{transform:scale(.94)}
.tile i{font-style:normal;background:var(--pan);border-radius:999px;padding:2px 14px;font-weight:700}
.stg .tile{animation:rise .45s both;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}}
@keyframes sl{from{transform:translateY(100%)}}@keyframes fd{from{opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bump{40%{transform:scale(1.07)}}@keyframes pulse{50%{opacity:.8;transform:scale(1.02)}}@keyframes burst{to{transform:rotate(var(--a)) translateY(calc(-1*var(--d)));opacity:0}}
.bar{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:680px;margin-inline:auto;z-index:20;background:var(--navy);color:#fff;border:0;border-radius:26px;padding:14px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700;box-shadow:0 10px 30px rgba(15,47,115,.35)}
.bar span:nth-child(2){flex:1;text-align:start}.bar:disabled{background:var(--pan);color:var(--mut);box-shadow:none;border:1px solid var(--line);cursor:default}
.bar.bump{animation:bump .35s .55s}.cnt{background:var(--gold);color:#1b1405;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center}.bar:disabled .cnt{background:var(--line);color:var(--mut)}
.fly{position:fixed;font-size:44px;z-index:40;pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(5,12,35,.55);z-index:30}.ov.in{animation:fd .25s}
.sheet{position:fixed;inset-inline:0;bottom:0;max-width:560px;margin-inline:auto;background:var(--pan);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:31;max-height:88vh;overflow:auto}.sheet.in{animation:sl .35s cubic-bezier(.2,.9,.3,1)}
.sheet h3,section h3{margin:0 0 10px}.ln{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}.ln span:first-child{flex:1}.ln.pop{animation:pop .3s}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:22px;margin:14px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:transform .15s}.btn:active{transform:scale(.97)}
.pri{background:var(--navy);color:#fff}.sec{background:transparent;border:2px solid var(--navy);color:var(--navy)}.gold{background:var(--gold);color:#1b1405}
.lnk{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;padding:8px;width:100%}
.mut{color:var(--mut)}.ready,.help{border-radius:16px;padding:10px 14px;margin-bottom:14px;color:#fff;font-weight:700;animation:pulse 2.2s ease-in-out infinite}.ready{background:var(--ok)}.help{background:var(--gold);color:#1b1405;display:flex;justify-content:space-between}
.done{text-align:center;padding:50px 16px;position:relative}.done .big{font-size:130px;font-weight:700;color:var(--navy);line-height:1;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.cf{position:absolute;left:50%;top:190px}.cf i{position:absolute;width:10px;height:10px;border-radius:50%;transform:rotate(var(--a));animation:burst 1s ease-out forwards}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols h3{background:var(--pan);border-radius:14px;padding:8px 14px}
.o{background:var(--pan);border-radius:16px;padding:12px;margin-bottom:10px;border-inline-start:6px solid var(--gold)}.o b{font-size:20px}.s-prep{border-color:var(--navy)}.s-ready{border-color:var(--ok)}.o.in{animation:rise .45s}.oc{background:var(--pan);border-radius:18px;padding:14px;margin-bottom:14px}.oc h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}.fr{display:flex;gap:8px;flex-wrap:wrap}.fr input,.fr select,.num{font:inherit;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);min-width:0}.fr input{flex:1 1 120px}.num{width:90px}.kps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.kp{background:var(--pan);border-radius:18px;padding:14px;display:flex;flex-direction:column}.kp b{font-size:26px}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips .cat{flex-direction:row;padding:8px 18px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.rail{flex-direction:row;overflow-x:auto;position:static}.cat{flex-direction:row;padding:8px 16px;white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>

const K='ahmx:v1',$=s=>document.querySelector(s),HUE=[215,35,340,150],RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let bc=null;try{bc=new BroadcastChannel('ahmx')}catch(e){}
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}s=s||{};s.o=s.o||[];s.n=s.n||{};s.h=s.h||{};s.menu=s.menu||{};s.codes=s.codes||{};return s}
let S=load(),V={role:'kiosk',shop:'cafe',cat:null,done:null,helped:false,open:false,c:{kiosk:{},cashier:{}}},fx={},tm,seen=-1,shown=new Set();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}try{bc&&bc.postMessage(1)}catch(e){}}
const sync=()=>{S=load();render()};if(bc)bc.onmessage=sync;addEventListener('storage',e=>{if(e.key===K)sync()});
const mine=()=>S.o.filter(o=>o.sh===V.shop),live=()=>mine().filter(o=>Date.now()-o.t<864e5),
CATS=()=>S.menu[V.shop]||SHOPS[V.shop].cats,mm=()=>S.menu[V.shop]||(S.menu[V.shop]=JSON.parse(JSON.stringify(SHOPS[V.shop].cats))),
menu=()=>{const o=[];Object.keys(CATS()).forEach((c,ci)=>CATS()[c].forEach(x=>o.push({c,ci,n:x[0],p:x[1],e:x[2],i:o.length})));return o},
tile=(m,k)=>`<button class="tile" style="--h:${HUE[m.ci%4]};--d:${k*45}ms" data-a="add" data-v="${m.i}"><span class="em">${m.e}</span><b>${m.n}</b><i>${m.p} ر.س</i></button>`,
catsH=()=>{const sh=CATS(),cs=Object.keys(sh);if(!cs.includes(V.cat))V.cat=cs[0];return `<div class="shell"><nav class="rail">${cs.map(c=>`<button class="cat" aria-pressed="${c===V.cat}" data-a="cat" data-v="${c}"><span>${sh[c][0]?sh[c][0][2]:'📁'}</span>${c}</button>`).join('')}</nav><div class="grid${fx.fade?' stg':''}">${menu().filter(m=>m.c===V.cat).map(tile).join('')}</div></div>`},
ord=(x,b,k=V.role+x.id+x.st,f=!shown.has(k)&&shown.add(k))=>`<div class="o s-${x.st}${f?' in':''}"><b>#${x.no}</b> <span class="mut">منذ ${Math.max(0,Math.round((Date.now()-x.t)/6e4))} د</span><div>${x.items.map(i=>i.q+'× '+i.n).join('، ')}</div>${b}</div>`;
function bar(r){const C=V.c[r],M=menu().filter(m=>C[m.i]),n=M.reduce((s,m)=>s+C[m.i],0),t=M.reduce((s,m)=>s+m.p*C[m.i],0),d=t?'':'disabled';
let h=`<button class="bar${fx.bump?' bump':''}" id="bar" data-a="open" ${d}><span class="cnt">${n}</span><span>${n?'راجع طلبك':'اختر من القائمة'}</span><b>${t} ر.س</b></button>`;
if(V.open&&n)h+=`<div class="ov${fx.sheet?' in':''}" data-a="close"></div><div class="sheet${fx.sheet?' in':''}"><h3>طلبك</h3>${M.map(m=>`<div class="ln${m.i===fx.last?' pop':''}"><span>${m.e} ${m.n}</span><span class="q"><button data-a="dec" data-v="${m.i}" aria-label="أنقص">−</button>${C[m.i]}<button data-a="add" data-v="${m.i}" aria-label="زِد">+</button></span><b>${m.p*C[m.i]}</b></div>`).join('')}<div class="tot"><span>الإجمالي</span><b>${t} ر.س</b></div>`+
(r==='kiosk'?`<button class="btn pri" data-a="pay" data-v="card">ادفع بالبطاقة</button><button class="btn sec" data-a="pay" data-v="counter">ادفع عند الكاشير</button><button class="lnk" data-a="help">${V.helped?'تم إبلاغ الكاشير، لحظات':'أحتاج مساعدة'}</button>`:`<button class="btn pri" data-a="pay" data-v="cash">دفع نقدي</button><button class="btn sec" data-a="pay" data-v="card">دفع بالبطاقة</button>`)+`<button class="lnk" data-a="close">رجوع للقائمة</button></div>`;return h}
function kiosk(){if(V.done){const d=V.done;return `<div class="done"><div class="cf">${Array.from({length:18},(_,i)=>`<i style="--a:${i*20}deg;--d:${90+i%3*35}px;background:hsl(${i*20} 90% 58%)"></i>`).join('')}</div><h2>${d.wait?'طلبك محفوظ':'تم الدفع، شكراً'}</h2><div class="big">${d.no}</div><p>${d.wait?'توجه للكاشير وادفع عشان يبدأ التحضير.':'هذا رقم طلبك. تابع الشاشة وبننادي رقمك لما يجهز.'}</p></div>`}
const r=live().filter(o=>o.st==='ready');return (r.length?`<div class="ready">جاهزة للاستلام: ${r.map(o=>'#'+o.no).join('، ')}</div>`:'')+catsH()+bar('kiosk')}
function cashier(){const o=live(),un=o.filter(x=>x.st==='unpaid'),rd=o.filter(x=>x.st==='ready'),tot=o.filter(x=>x.st!=='unpaid'&&new Date(x.t).toDateString()===new Date().toDateString()).reduce((s,x)=>s+x.total,0),em='<p class="mut">لا يوجد.</p>';
return (S.h[V.shop]?`<div class="help">عميل يحتاج مساعدة عند الشاشة <button class="lnk" style="width:auto;color:#1b1405" data-a="ok">تم</button></div>`:'')+catsH()+`<section style="margin-top:22px"><h3>بانتظار الدفع (${un.length})</h3>${un.map(x=>ord(x,`<button class="btn gold" data-a="paid" data-v="${x.id}">استلام الدفع ${x.total} ر.س</button>`)).join('')||em}<h3>جاهزة للتسليم (${rd.length})</h3>${rd.map(x=>ord(x,`<button class="btn sec" data-a="adv" data-v="${x.id}|done">تم التسليم</button>`)).join('')||em}<p class="mut">مبيعات اليوم: ${tot} ر.س</p></section>`+bar('cashier')}
function owner(){const C=CATS(),cs=Object.keys(C);return `<section>${fx.msg?`<div class="help">${fx.msg}</div>`:''}<h3>إدارة منيو ${SHOPS[V.shop].name}</h3><p class="mut">أي تغيير يظهر مباشرة في شاشة العميل والكاشير.</p>${cs.map(c=>`<div class="oc"><h4>${c}<button class="lnk" style="width:auto" data-a="delcat" data-v="${c}">حذف القسم</button></h4>${C[c].map((x,i)=>`<div class="ln"><span>${x[2]} ${x[0]}</span><input class="num" type="number" min="0" value="${x[1]}" data-pc="${c}" data-pi="${i}" aria-label="سعر ${x[0]}"><button class="lnk" style="width:auto" data-a="delitem" data-v="${c}|${i}">حذف</button></div>`).join('')||'<p class="mut">لا توجد أصناف في هذا القسم.</p>'}</div>`).join('')}<div class="oc"><h4>إضافة صنف</h4><div class="fr"><select id="ic">${cs.map(c=>`<option>${c}</option>`).join('')}</select><input id="in" placeholder="اسم الصنف"><input id="ip" type="number" min="0" placeholder="السعر"><input id="ie" placeholder="إيموجي" maxlength="4" value="🍽️"></div><button class="btn pri" data-a="additem">أضف الصنف</button></div><div class="oc"><h4>إضافة قسم</h4><div class="fr"><input id="cn" placeholder="اسم القسم"></div><button class="btn sec" data-a="addcat">أضف القسم</button></div><div class="oc"><h4>رموز الدخول</h4><p class="mut">${S.codes[V.shop]?'رمز الموظفين يفتح العميل والكاشير والمطبخ، ورمز المالك يفتح كل الأقسام.':'الرموز الحالية افتراضية، غيّرها الآن.'}</p><div class="fr"><input id="sc" type="password" inputmode="numeric" autocomplete="off" placeholder="رمز الموظفين"><input id="oc2" type="password" inputmode="numeric" autocomplete="off" placeholder="رمز المالك"></div><button class="btn pri" data-a="savecodes">حفظ الرموز</button></div><div class="oc"><h4>سجلات الطلبات</h4><button class="btn sec" data-a="reset">${V.cf?'اضغط مرة ثانية لتأكيد الحذف':'حذف كل سجلات هذا المحل'}</button></div></section>`}
async function H(s,sh){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ahmx|'+sh+'|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+s}}
function lock(){return `<div class="done"><h2>أدخل رمز الدخول</h2><div class="fr" style="max-width:360px;margin:16px auto"><select id="ls">${Object.keys(SHOPS).map(k=>`<option value="${k}">${SHOPS[k].name}</option>`).join('')}</select><input id="lc" type="password" inputmode="numeric" autocomplete="off" placeholder="الرمز" style="text-align:center;font-size:22px"></div><button class="btn pri" style="max-width:360px;margin:auto" data-a="login">دخول</button>${fx.msg?`<p class="mut">${fx.msg}</p>`:''}</div>`}
function sales(){const now=new Date(),all=mine().filter(o=>o.st!=='unpaid'),P=V.rp||'today',Y=d=>d.getFullYear()===now.getFullYear(),M=d=>Y(d)&&d.getMonth()===now.getMonth(),D=d=>M(d)&&d.getDate()===now.getDate(),F={today:D,month:M,year:Y,all:()=>true}[P];
const kp=(l,f)=>{const L=all.filter(o=>f(new Date(o.t)));return `<div class="kp"><span class="mut">${l}</span><b>${L.reduce((s,o)=>s+o.total,0)} ر.س</b><span class="mut">${L.length} طلب</span></div>`};
const pr=all.filter(o=>F(new Date(o.t))),sm=p=>pr.filter(o=>o.pay===p).reduce((s,o)=>s+o.total,0),top={},rows=mine().filter(o=>F(new Date(o.t))).sort((a,b)=>b.t-a.t),ST={unpaid:'بانتظار الدفع',new:'جديد',prep:'قيد التحضير',ready:'جاهز',done:'سُلّم'},PY={cash:'نقد',card:'بطاقة'};
pr.forEach(o=>o.items.forEach(i=>top[i.n]=(top[i.n]||0)+i.q));const tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `<section><h3>المبيعات</h3><div class="kps">${kp('اليوم',D)}${kp('هذا الشهر',M)}${kp('هذه السنة',Y)}</div><div class="chips">${[['today','اليوم'],['month','الشهر'],['year','السنة'],['all','الكل']].map(([v,l])=>`<button class="cat" aria-pressed="${v===P}" data-a="rp" data-v="${v}">${l}</button>`).join('')}</div><div class="kps"><div class="kp"><span class="mut">نقداً</span><b>${sm('cash')} ر.س</b></div><div class="kp"><span class="mut">بالبطاقة</span><b>${sm('card')} ر.س</b></div></div><h3>الأكثر مبيعاً</h3>${tp.map(([n,q])=>`<div class="ln"><span>${n}</span><b>${q}</b></div>`).join('')||'<p class="mut">لا توجد مبيعات في هذه الفترة.</p>'}<h3 style="margin-top:20px">سجل الطلبات (${rows.length})</h3><div class="tw"><table><tr><th>الرقم</th><th>التاريخ</th><th>الأصناف</th><th>المبلغ</th><th>الدفع</th><th>الحالة</th></tr>${rows.slice(0,200).map(o=>`<tr><td>#${o.no}</td><td>${new Date(o.t).toLocaleString('ar-SA-u-ca-gregory',{dateStyle:'short',timeStyle:'short'})}</td><td>${o.items.map(i=>i.q+'× '+i.n).join('، ')}</td><td>${o.total}</td><td>${PY[o.pay]||'-'}</td><td>${ST[o.st]||o.st}</td></tr>`).join('')}</table></div></section>`}
const cols=[['new','جديدة','ابدأ التحضير','prep'],['prep','قيد التحضير','الطلب جاهز','ready'],['ready','جاهزة','تم التسليم','done']];
function beep(){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},250)}catch(e){}}
function kitchen(){const o=live().sort((a,b)=>a.t-b.t),n=o.filter(x=>x.st==='new').length;if(seen>=0&&n>seen)beep();seen=n;
return `<div class="cols">${cols.map(([s,l,b,nx])=>{const L=o.filter(x=>x.st===s);return `<section><h3>${l} (${L.length})</h3>${L.map(x=>ord(x,`<button class="btn ${s==='new'?'gold':'pri'}" data-a="adv" data-v="${x.id}|${nx}">${b}</button>`)).join('')||'<p class="mut">لا شيء هنا الآن.</p>'}</section>`}).join('')}</div>`}
function place(pay,st){const C=V.c[V.role],items=menu().filter(m=>C[m.i]).map(m=>({n:m.n,p:m.p,q:C[m.i]}));if(!items.length)return 0;const sh=V.shop,no=S.n[sh]=(S.n[sh]||100)+1;
S.o.push({id:Date.now()+'-'+no,sh,no,items,total:items.reduce((s,x)=>s+x.p*x.q,0),pay,st,t:Date.now()});V.c[V.role]={};V.helped=false;V.open=false;save();return no}
const act={role:v=>{if(['owner','sales'].includes(v)&&!(V.auth&&V.auth.role==='owner'))return;V.role=v;seen=-1;V.open=false;fx.fade=1},cat:v=>{V.cat=v;fx.fade=1},add:v=>{const C=V.c[V.role];C[v]=(C[v]||0)+1;fx.bump=1;fx.last=+v},dec:v=>{const C=V.c[V.role];C[v]>1?C[v]--:delete C[v];fx.last=+v},open:()=>{V.open=true;fx.sheet=1},close:()=>{V.open=false},
pay:v=>{const w=v==='counter',no=place(w?'':v,w?'unpaid':'new');if(no&&V.role==='kiosk'){V.done={no,wait:w};clearTimeout(tm);tm=setTimeout(()=>{V.done=null;fx.fade=1;render()},9000)}},
help:()=>{S.h[V.shop]=1;V.helped=true;save()},ok:()=>{delete S.h[V.shop];save()},
paid:id=>{const o=S.o.find(x=>x.id===id);if(o){o.st='new';o.pay='cash';save()}},adv:v=>{const[id,st]=v.split('|'),o=S.o.find(x=>x.id===id);if(o){o.st=st;save()}},reset:()=>{if(!V.cf){V.cf=1;return}V.cf=0;S.o=S.o.filter(o=>o.sh!==V.shop);S.n[V.shop]=100;save();fx.msg='تم حذف سجلات المحل'},
rp:v=>{V.rp=v},logout:()=>{V.auth=null;V.c={kiosk:{},cashier:{}};V.open=false;V.role='kiosk';try{sessionStorage.removeItem('ahmx:a')}catch(e){}},
login:async()=>{const sh=$('#ls').value,c=$('#lc').value;if(Date.now()<(V.until||0)){fx.msg='محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة.';return}const k=S.codes[sh],ho=k?k.owner:await H('2222',sh),hs=k?k.staff:await H('1111',sh),h=await H(c,sh);
if(c&&(h===ho||h===hs)){V.auth={shop:sh,role:h===ho?'owner':'staff'};V.fail=0;V.role='kiosk';try{sessionStorage.setItem('ahmx:a',JSON.stringify(V.auth))}catch(e){}}else{V.fail=(V.fail||0)+1;if(V.fail>=5){V.until=Date.now()+30000;V.fail=0}fx.msg='الرمز غير صحيح.'}render()},
savecodes:async()=>{const a=$('#sc').value.trim(),b=$('#oc2').value.trim();if(a.length<4||b.length<4||a===b){fx.msg='الرمزان لازم يكونون 4 خانات أو أكثر ومختلفين.';return}const sh=V.shop;S.codes[sh]={staff:await H(a,sh),owner:await H(b,sh)};save();fx.msg='تم حفظ الرموز';render()},
additem:()=>{const n=$('#in').value.trim(),pv=$('#ip').value,e=$('#ie').value.trim()||'🍽️',c=$('#ic').value;if(!n||pv===''||+pv<0||!c){fx.msg='اكتب اسم الصنف وسعره واختر القسم.';return}mm()[c].push([n,+pv,e]);V.c={kiosk:{},cashier:{}};V.cat=c;save();fx.msg='تمت إضافة '+n},
addcat:()=>{const n=$('#cn').value.trim();if(!n){fx.msg='اكتب اسم القسم.';return}if(mm()[n]){fx.msg='القسم موجود من قبل.';return}mm()[n]=[];save();fx.msg='تمت إضافة قسم '+n},
delitem:v=>{const[c,i]=v.split('|');mm()[c].splice(+i,1);V.c={kiosk:{},cashier:{}};save()},
delcat:v=>{delete mm()[v];V.cat=null;V.c={kiosk:{},cashier:{}};save()}};
function fly(el){const b=$('#bar'),r=el.getBoundingClientRect(),t=b?b.getBoundingClientRect():{left:innerWidth/2,top:innerHeight-50,width:0,height:0},x=r.left+r.width/2,y=r.top+r.height/2,dx=t.left+t.width/2-x,dy=t.top+t.height/2-y,s=document.createElement('span');
s.className='fly';s.textContent=el.textContent;s.style.cssText=`left:${x}px;top:${y}px`;document.body.append(s);
s.animate([{transform:'translate(-50%,-50%) scale(1)'},{transform:`translate(calc(-50% + ${dx*.4}px),calc(-50% + ${dy*.4-70}px)) scale(1.4)`,offset:.4},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.3)`,opacity:.2}],{duration:650,easing:'ease-in'}).onfinish=()=>s.remove()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;if(b.dataset.a==='add'&&!RM){const em=b.querySelector('.em');em&&fly(em)}act[b.dataset.a](b.dataset.v);render()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.pc!==undefined){if(t.value!==''&&+t.value>=0){mm()[t.dataset.pc][+t.dataset.pi][1]=+t.value;V.c={kiosk:{},cashier:{}};save()}render()}});
try{V.auth=JSON.parse(sessionStorage.getItem('ahmx:a'))}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lc')act.login()});
document.querySelector('.seg').insertAdjacentHTML('afterend','<button class="lnk" id="out" data-a="logout" style="width:auto">خروج</button>');
const sel=$('#shop');sel.innerHTML=Object.keys(SHOPS).map(k=>`<option value="${k}">${SHOPS[k].name}</option>`).join('');
sel.onchange=()=>{V.shop=sel.value;V.c={kiosk:{},cashier:{}};V.cat=null;V.done=null;V.helped=false;V.open=false;seen=-1;fx.fade=1;render()};
function render(){const A=V.auth,seg=$('.seg');sel.style.display=$('#out').style.display=seg.style.display=A?'':'none';if(A){V.shop=A.shop;sel.value=A.shop;sel.disabled=true;const T=[['kiosk','شاشة العميل'],['cashier','الكاشير'],['kitchen','المطبخ']];if(A.role==='owner')T.push(['owner','إدارة المحل'],['sales','المبيعات والسجلات']);if(!T.some(t=>t[0]===V.role))V.role='kiosk';seg.innerHTML=T.map(([v,l])=>`<button class="tab" data-a="role" data-v="${v}" aria-pressed="${v===V.role}">${l}</button>`).join('')}$('#app').innerHTML=A?{kiosk,cashier,kitchen,owner,sales}[V.role]():lock();for(const k in fx)delete fx[k]}
